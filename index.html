<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zombie FPS — block prototype</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* Crosshair: exactly at viewport centre */
  #crosshair { position: fixed; left: 50%; top: 50%; width: 0; height: 0;
    transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
  #crosshair .h, #crosshair .v { position: absolute; background: #d8ffe0;
    box-shadow: 0 0 3px rgba(0,0,0,.9); }
  #crosshair .h { width: 18px; height: 2px; left: -9px; top: -1px; }
  #crosshair .v { width: 2px; height: 18px; left: -1px; top: -9px; }
  #crosshair .dot { position: absolute; width: 2px; height: 2px; left: -1px; top: -1px;
    background: #ffffff; }

  #hud { position: fixed; left: 16px; bottom: 14px; color: #cfe8d8; z-index: 10;
    font: 600 13px/1.5 ui-monospace, Menlo, monospace; pointer-events: none;
    text-shadow: 0 1px 2px #000; }
  #hud .row { display: flex; align-items: center; gap: 8px; }
  #hpbar { width: 220px; height: 10px; background: rgba(0,0,0,.55); border: 1px solid #3d5a48; }
  #hpfill { height: 100%; width: 100%; background: linear-gradient(90deg, #46e07f, #b6ff5e); transition: width .12s; }

  #banner { position: fixed; left: 50%; top: 18%; transform: translateX(-50%);
    color: #ffe9a8; font: 700 22px ui-monospace, Menlo, monospace; z-index: 10;
    pointer-events: none; text-shadow: 0 2px 6px #000; opacity: 0; transition: opacity .3s; }

  #start { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; background: rgba(4,8,6,.82);
    color: #e8ffe8; font: 500 15px/1.6 ui-monospace, Menlo, monospace; text-align: center; }
  #start h1 { font-size: 26px; margin: 0; letter-spacing: 2px; }
  #start .btn { pointer-events: auto; cursor: pointer; padding: 10px 26px; font: inherit;
    background: #1d3a2a; color: #cfffdf; border: 1px solid #4d8f66; border-radius: 6px; }
  #start .btn:hover { background: #2a5238; }
  #start small { opacity: .75; }
  #start.hidden { display: none; }

  #debug { position: fixed; right: 12px; bottom: 12px; z-index: 11; display: none;
    color: #9fd8ff; font: 11px ui-monospace, Menlo, monospace; text-align: right;
    text-shadow: 0 1px 2px #000; pointer-events: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="crosshair"><div class="h"></div><div class="v"></div><div class="dot"></div></div>
<div id="hud">
  <div class="row">HP <div id="hpbar"><div id="hpfill"></div></div> <span id="hptext">100</span></div>
  <div class="row" id="score">KILLS 0 / 2</div>
</div>
<div id="banner"></div>
<div id="debug"></div>
<div id="start">
  <h1>ZOMBIE HALL</h1>
  <div>Click to play &mdash; pointer lock engages</div>
  <div class="btn" id="playBtn">CLICK TO START</div>
  <small>WASD move &middot; mouse look &middot; hold LEFT MOUSE to fire<br>
  Two zombies at the far end &mdash; 5 hits each</small>
</div>
<script type="module" src="./game.js"></script>
</body>
</html>
